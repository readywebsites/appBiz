    get:
      operationId: v1_analytics_dashboard_retrieve
      tags:
      - Executive Analytics & Reporting
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/audit/:
    get:
      operationId: v1_audit_list
      parameters:
      - name: page
