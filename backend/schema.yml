components:
  schemas:
    ActivityTypeEnum:
      enum:
      - CALL
      - WHATSAPP
      - EMAIL
      - MEETING
      - NOTE
      - STATUS_CHANGE
      type: string
      description: |-
        * `CALL` - Phone Call
        * `WHATSAPP` - WhatsApp Message
        * `EMAIL` - Email Sent
        * `MEETING` - Meeting/Demo
        * `NOTE` - Internal Note
        * `STATUS_CHANGE` - Status Update
    ApprovalTypeEnum:
      enum:
      - DESIGN_SIGN_OFF
      - MILESTONE_SIGN_OFF
      - FINAL_DELIVERY_SIGN_OFF
      type: string
      description: |-
        * `DESIGN_SIGN_OFF` - Design Sign-off
        * `MILESTONE_SIGN_OFF` - Milestone Sign-off
        * `FINAL_DELIVERY_SIGN_OFF` - Final Delivery Sign-off
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        actor_email:
          type: string
          readOnly: true
          default: System
        actor_role:
          type: string
          readOnly: true
          default: N/A
        action:
          type: string
          readOnly: true
        target_model:
          type: string
          readOnly: true
        target_id:
          type: string
          readOnly: true
        change_summary:
          type: string
          readOnly: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        user_agent:
          type: string
          readOnly: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - actor_email
      - actor_role
      - change_summary
      - id
      - ip_address
      - target_id
      - target_model
      - timestamp
      - user_agent
    BillingTypeEnum:
      enum:
      - ONE_TIME
      - MONTHLY
      - YEARLY
      type: string
      description: |-
        * `ONE_TIME` - One Time
        * `MONTHLY` - Monthly Subscription
        * `YEARLY` - Annual Subscription
    CategoryEnum:
      enum:
      - BILLING
      - PROJECT
      - TECHNICAL
      - SALES
      - GENERAL
      type: string
      description: |-
        * `BILLING` - Billing & Payments
        * `PROJECT` - Project Delivery & Scope
        * `TECHNICAL` - Technical Issue & Bug
        * `SALES` - Sales & Upgrade
        * `GENERAL` - General Enquiry
    ChangePassword:
      type: object
      properties:
        old_password:
          type: string
        new_password:
          type: string
      required:
      - new_password
      - old_password
    ChangePasswordRequest:
      type: object
      properties:
        old_password:
          type: string
          minLength: 1
        new_password:
          type: string
          minLength: 1
      required:
      - new_password
      - old_password
    ConsultationRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 20
        company_name:
          type: string
          maxLength: 150
        preferred_date:
          type: string
          format: date
        preferred_time_slot:
          type: string
          maxLength: 50
        topic:
          type: string
          maxLength: 200
        notes:
          type: string
        status:
          $ref: '#/components/schemas/Status498Enum'
        assigned_to:
          type: string
          format: uuid
          nullable: true
        assigned_to_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assigned_to_name
      - created_at
      - email
      - id
      - name
      - phone
      - preferred_date
    ConsultationRequestRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        phone:
          type: string
          minLength: 1
          maxLength: 20
        company_name:
          type: string
          maxLength: 150
        preferred_date:
          type: string
          format: date
        preferred_time_slot:
          type: string
          minLength: 1
          maxLength: 50
        topic:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: string
        status:
          $ref: '#/components/schemas/Status498Enum'
        assigned_to:
          type: string
          format: uuid
          nullable: true
      required:
      - email
      - name
      - phone
      - preferred_date
    Coupon:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 30
        description:
          type: string
          maxLength: 200
        discount_type:
          $ref: '#/components/schemas/DiscountTypeEnum'
        discount_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        min_order_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        max_discount_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        valid_from:
          type: string
          format: date-time
          nullable: true
        valid_to:
          type: string
          format: date-time
          nullable: true
        max_uses:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        current_uses:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - discount_value
      - id
    CouponRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 30
        description:
          type: string
          maxLength: 200
        discount_type:
          $ref: '#/components/schemas/DiscountTypeEnum'
        discount_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        min_order_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        max_discount_amount:
          type: string
          format: decimal
