        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Security & Compliance Audit
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
