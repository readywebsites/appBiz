openapi: 3.0.3
info:
  title: Biz499 API
  version: 1.0.0
  description: 'Complete enterprise-grade API for Biz499 Digital Services: mobile
    customer marketplace, CRM lead generation, instant quotations, orders, Razorpay
    payments, automated invoicing, project delivery, and administration.'
